<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Vidyara - Library & Study Center Management System</title>
    <meta name="description" content="Comprehensive SaaS Platform for Library Owners, Branch Management, Seats, Attendance, and WhatsApp Reminders" />
    <meta name="theme-color" content="#6750A4" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/manifest.json" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        overflow-x: hidden;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #F8FAFC;
        color: #0F172A;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        width: 100%;
      }
      /* Prevent iOS auto-zoom on input focus */
      input, select, textarea {
        font-size: 16px !important;
      }
      /* Smooth loading spinner */
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Global Responsive Utilities for Mobile Phones (< 768px) */
      @media (max-width: 768px) {
        .mobile-hide {
          display: none !important;
        }
        .mobile-stack {
          flex-direction: column !important;
          width: 100% !important;
        }
        .mobile-full-width {
          width: 100% !important;
          max-width: 100% !important;
        }
        .mobile-padding {
          padding: 16px !important;
        }
        .mobile-header {
          padding: 12px 16px !important;
        }
        .mobile-nav-scroll {
          overflow-x: auto !important;
          white-space: nowrap !important;
          -webkit-overflow-scrolling: touch;
          padding-bottom: 4px;
        }
        .mobile-card-grid {
          grid-template-columns: 1fr !important;
        }
        .mobile-seat-grid {
          grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)) !important;
          gap: 8px !important;
          padding: 12px !important;
        }
        .mobile-table-wrapper {
          overflow-x: auto !important;
          width: 100% !important;
          display: block !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => console.log('SW reg fail:', err));
        });
      }
    </script>
  </body>
</html>
